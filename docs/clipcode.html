<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clipcode</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23222a3a'/%3E%3Cpath d='M10 10l-5 6 5 6M22 10l5 6-5 6' stroke='%236ea8ff' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root { --bg:#f7f8fa; --fg:#1d2330; --muted:#6b7385; --line:rgba(128,128,128,.28); --ac:#2f6fed; --acfg:#fff; color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--fg);
         font: 14px/1.4 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); }
  .title { font-weight: 650; font-size: 15px; letter-spacing: .01em; margin-right: 6px; }
  .grow { flex: 1; }
  select, button, input[type=number], summary {
    font: inherit; color: inherit; background: transparent; border: 1px solid var(--line);
    border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  button:hover, summary:hover, select:hover { background: rgba(128,128,128,.14); }
  select option { color: #111; background: #fff; }
  button.pri { background: var(--ac); color: var(--acfg); border-color: transparent; font-weight: 600; min-width: 74px; }
  button.pri:hover { filter: brightness(1.1); background: var(--ac); }
  :focus-visible { outline: 2px solid var(--ac); outline-offset: 1px; }
  details { position: relative; }
  summary { list-style: none; user-select: none; }
  summary::-webkit-details-marker { display: none; }
  .panel { position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; width: 240px; padding: 12px;
           background: var(--bg); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.28);
           display: grid; gap: 10px; }
  .panel label { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
  .panel input[type=number] { width: 64px; }
  main { flex: 1; min-height: 0; position: relative; display: flex; }
  #editor { flex: 1 1 0; min-width: 0; min-height: 0; position: relative; overflow: hidden; }
  button.on { background: rgba(128,128,128,.22); }
  #preview { flex: 1 1 0; min-width: 0; min-height: 0; overflow: auto; padding: 16px 28px 40px; border-left: 1px solid var(--line); line-height: 1.65; }
  #preview[hidden] { display: none; }
  #preview > :first-child { margin-top: 0; }
  #preview h1, #preview h2 { padding-bottom: .25em; border-bottom: 1px solid var(--line); }
  #preview a { color: var(--ac); }
  #preview img { max-width: 100%; }
  #preview code { font: 13px Consolas, "Cascadia Mono", monospace; background: rgba(128,128,128,.18); padding: .1em .35em; border-radius: 4px; }
  #preview pre { background: rgba(128,128,128,.14); padding: 12px 14px; border-radius: 8px; overflow: auto; }
  #preview pre code { background: none; padding: 0; }
  #preview blockquote { margin: 1em 0; padding: 0 1em; border-left: 3px solid var(--ac); color: var(--muted); }
  #preview table { border-collapse: collapse; }
  #preview th, #preview td { border: 1px solid var(--line); padding: 5px 12px; }
  @media (max-width: 640px) { main { flex-direction: column; } #preview { border-left: 0; border-top: 1px solid var(--line); } }
  footer { display: flex; flex-wrap: wrap; gap: 4px 18px; padding: 5px 12px; border-top: 1px solid var(--line);
           font-size: 12px; color: var(--muted); }
  body.drag main::after { content: "Drop a file to open it"; position: absolute; inset: 10px; z-index: 10; display: grid; place-items: center;
           font-size: 18px; background: color-mix(in srgb, var(--bg) 88%, transparent); border: 2px dashed var(--ac); border-radius: 12px; }
  @media (max-width: 640px) { .hide-sm { display: none; } header { padding: 6px 8px; } }
</style>
</head>
<body>
<header>
  <span class="title">Clipcode</span>
  <select id="mode" aria-label="Language"></select>
  <span class="grow"></span>
  <button id="btn-open">Open</button>
  <button id="btn-paste">Paste</button>
  <button id="btn-clear">Clear</button>
  <button id="btn-save">Download</button>
  <button id="btn-prev" hidden aria-pressed="true">Preview</button>
  <details id="set">
    <summary>Settings</summary>
    <div class="panel">
      <label>Theme
        <select id="theme">
          <option value="auto">Match system</option>
          <option value="light">Light</option>
          <option value="dark">Dark</option>
          <option value="monokai">Monokai</option>
          <option value="tnb">Tomorrow Night Blue</option>
          <option value="hc">High contrast</option>
        </select>
      </label>
      <label>Font size <input id="fsize" type="number" min="10" max="32" value="14"></label>
      <label>Line endings
        <select id="eol"><option value="1">CRLF (Windows)</option><option value="0">LF (Unix)</option></select>
      </label>
      <label>Wrap long lines <input type="checkbox" id="wrap"></label>
      <label>Minimap <input type="checkbox" id="mini"></label>
      <label>Save with UTF-8 BOM <input type="checkbox" id="bom"></label>
    </div>
  </details>
  <button id="btn-copy" class="pri">Copy</button>
  <input type="file" id="file" hidden>
</header>
<main><div id="editor"></div><div id="preview" hidden></div></main>
<footer>
  <span id="pos">Loading editor...</span>
  <span id="cnt"></span>
  <span id="eolst"></span>
  <span class="grow"></span>
  <span id="saved" class="hide-sm">Each language autosaves in this browser. F1 opens commands.</span>
</footer>

<!-- Loaded before Monaco's AMD loader so they register as plain globals -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min/vs/loader.js"></script>
<script>
(function () {
  var BASE = 'https://cdn.jsdelivr.net/npm/monaco-editor@0.52.2/min';
  var LANGS = [
    ['shell','Shell','.sh'], ['python','Python','.py'], ['powershell','PowerShell','.ps1'], ['markdown','Markdown','.md'],
    ['html','HTML','.html'], ['javascript','JavaScript','.js'], ['vb','VBScript','.vbs'], ['json','JSON','.json'],
    ['xml','XML','.xml'], ['sql','SQL','.sql'], ['yaml','YAML','.yml'], ['plaintext','Plain text','.txt']
  ];
  var SHEBANG = { shell: '#!/usr/bin/env bash', python: '#!/usr/bin/env python3' };
  // UI colors follow the editor theme: [monaco theme, page bg, text, muted, accent, text on accent]
  var UI = {
    light:  ['vs',        '#f7f8fa', '#1d2330', '#6b7385', '#2f6fed', '#ffffff'],
    dark:   ['vs-dark',   '#15181e', '#d7dce4', '#8a93a6', '#6ea8ff', '#0b1220'],
    monokai:['monokai',   '#272822', '#f8f8f2', '#a59f85', '#a6e22e', '#1c1d17'],
    tnb:    ['tnb',       '#002451', '#ffffff', '#8fa3c7', '#ffc58f', '#1a1206'],
    hc:     ['hc-black',  '#000000', '#ffffff', '#c8c8c8', '#ffd400', '#000000']
  };
  // First-time text for each language: simple variables and print. Used only until that language has saved text.
  var STARTERS = {
    shell: '#!/usr/bin/env bash\n\nname="world"\necho "Hello, $name"\n',
    python: '#!/usr/bin/env python3\n\nname = "world"\nprint(f"Hello, {name}")\n',
    powershell: '$name = "world"\nWrite-Output "Hello, $name"\n',
    markdown: "# Notes\n\nWrite on the left, read on the right.\n\n## Formatting\n\n**Bold**, *italic*, `inline code` and a [link](https://example.com).\n\n- A bullet list\n- With a second item\n\n1. A numbered list\n2. With steps\n\n> A quote\n\n## Code\n\n```bash\necho \"hello\"\n```\n\n| Name | Value |\n| --- | --- |\n| Example | 42 |\n",
    html: '<!DOCTYPE html>\n<html>\n<body>\n  <p id="out"></p>\n  <script>\n    const name = "world";\n    document.getElementById("out").textContent = "Hello, " + name;\n  <\/script>\n</body>\n</html>\n',
    javascript: 'const name = "world";\nconsole.log(`Hello, ${name}`);\n',
    vb: 'Dim name\nname = "world"\nWScript.Echo "Hello, " & name\n',
    json: '{\n  "name": "world"\n}\n',
    xml: '<?xml version="1.0" encoding="UTF-8"?>\n<greeting>\n  <name>world</name>\n</greeting>\n',
    sql: "SELECT 'world' AS name;\n",
    yaml: 'name: world\n',
    plaintext: ''
  };
  var $ = function (id) { return document.getElementById(id); };
  function load(k, d) {
    try { var v = localStorage.getItem('pad.' + k); if (v !== null) return v; } catch (e) {}
    try { var s = sessionStorage.getItem('pad.' + k); if (s !== null) return s; } catch (e) {}
    return d;
  }
  function save(k, v) {
    var ok = false;
    try { localStorage.setItem('pad.' + k, v); ok = true; } catch (e) {}
    try { sessionStorage.setItem('pad.' + k, v); ok = true; } catch (e) {}
    return ok;
  }

  LANGS.forEach(function (l) {
    var o = document.createElement('option'); o.value = l[0]; o.textContent = l[1]; o.dataset.ext = l[2]; $('mode').appendChild(o);
  });

  window.MonacoEnvironment = { getWorkerUrl: function () {
    return 'data:text/javascript;charset=utf-8,' + encodeURIComponent(
      "self.MonacoEnvironment={baseUrl:'" + BASE + "/'};importScripts('" + BASE + "/vs/base/worker/workerMain.js');");
  } };

  require.config({ paths: { vs: BASE + '/vs' } });
  require(['vs/editor/editor.main'], function () {
    function def(name, base, bg, fg, hl, rules) {
      monaco.editor.defineTheme(name, { base: base, inherit: true, rules: rules,
        colors: { 'editor.background': bg, 'editor.foreground': fg, 'editor.lineHighlightBackground': hl } });
    }
    def('monokai', 'vs-dark', '#272822', '#f8f8f2', '#3e3d32', [
      { token: 'comment', foreground: '75715e' }, { token: 'string', foreground: 'e6db74' }, { token: 'keyword', foreground: 'f92672' },
      { token: 'number', foreground: 'ae81ff' }, { token: 'variable', foreground: 'a6e22e' }, { token: 'type', foreground: '66d9ef' }]);
    def('tnb', 'vs-dark', '#002451', '#ffffff', '#00346e', [
      { token: 'comment', foreground: '7285b7' }, { token: 'string', foreground: 'd1f1a9' }, { token: 'keyword', foreground: 'ebbbff' },
      { token: 'number', foreground: 'ffc58f' }, { token: 'variable', foreground: 'ff9da4' }, { token: 'type', foreground: 'bbdaff' }]);

    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    function applyTheme(choice) {
      var key = choice === 'auto' ? (mq.matches ? 'dark' : 'light') : (UI[choice] ? choice : 'light');
      var u = UI[key], s = document.documentElement.style;
      s.setProperty('--bg', u[1]); s.setProperty('--fg', u[2]); s.setProperty('--muted', u[3]);
      s.setProperty('--ac', u[4]); s.setProperty('--acfg', u[5]);
      s.colorScheme = key === 'light' ? 'light' : 'dark';
      monaco.editor.setTheme(u[0]);
    }

    var lang = load('lang', 'powershell'), choice = load('theme', 'auto');
    if (!LANGS.some(function (l) { return l[0] === lang; })) lang = 'powershell';
    $('mode').value = lang; $('theme').value = choice;
    $('fsize').value = load('fsize', '14');
    $('wrap').checked = load('wrap', '0') === '1';
    $('mini').checked = load('mini', '0') === '1' && innerWidth > 700;
    $('bom').checked = load('bom', '0') === '1';
    $('eol').value = load('eol', '1');

    // One saved buffer per language, kept as { language: { t: text, v: view state } }
    var bufs = {};
    try { bufs = JSON.parse(load('bufs', '{}')) || {}; } catch (e) {}
    var old = load('text', null);   // text from the earlier single-buffer version
    if (old !== null) {
      if (!bufs[lang]) bufs[lang] = { t: old.replace(/\r\n/g, '\n') };
      ['text', 'view'].forEach(function (k) {
        try { localStorage.removeItem('pad.' + k); } catch (e) {}
        try { sessionStorage.removeItem('pad.' + k); } catch (e) {}
      });
    }
    var models = {}, views = {}, cur = lang;
    function getModel(l) {
      if (!models[l]) {
        var b = bufs[l];
        models[l] = monaco.editor.createModel(b ? b.t : (STARTERS[l] || ''), l);
        models[l].setEOL(+$('eol').value);
        if (b && b.v) views[l] = b.v;
      }
      return models[l];
    }

    var editor = monaco.editor.create($('editor'), {
      model: getModel(lang), fontSize: +$('fsize').value,
      wordWrap: $('wrap').checked ? 'on' : 'off', minimap: { enabled: $('mini').checked },
      automaticLayout: true, scrollBeyondLastLine: false, renderWhitespace: 'selection', tabSize: 4,
      padding: { top: 10 }, fontLigatures: false
    });
    try { if (views[lang]) editor.restoreViewState(views[lang]); } catch (e) {}
    applyTheme(choice);
    mq.addEventListener && mq.addEventListener('change', function () { if ($('theme').value === 'auto') applyTheme('auto'); });

    function status() {
      var p = editor.getPosition(), m = editor.getModel();
      $('pos').textContent = 'Line ' + p.lineNumber + ', column ' + p.column;
      $('cnt').textContent = m.getLineCount() + ' lines, ' + m.getValueLength() + ' characters';
      $('eolst').textContent = m.getEOL() === '\r\n' ? 'CRLF' : 'LF';
    }
    editor.onDidChangeCursorPosition(status);
    var t, failing = false;
    function persist() {
      clearTimeout(t);
      try { views[cur] = editor.saveViewState(); } catch (e) {}
      Object.keys(models).forEach(function (l) {
        bufs[l] = { t: models[l].getValue().replace(/\r\n/g, '\n'), v: views[l] || null };
      });
      var ok = save('bufs', JSON.stringify(bufs));
      failing = !ok;
      $('saved').textContent = ok
        ? 'Saved ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' }) + '. Ctrl+S downloads.'
        : 'Not saved: this browser blocks storage. Download your work before leaving.';
    }
    editor.onDidChangeModelContent(function () { status(); clearTimeout(t); t = setTimeout(persist, 250); });
    window.addEventListener('pagehide', persist);
    document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') persist(); });
    window.addEventListener('beforeunload', function (e) { persist(); if (failing) { e.preventDefault(); e.returnValue = ''; } });
    status();

    function ext() { return $('mode').selectedOptions[0].dataset.ext; }
    var prevOn = load('prev', '1') === '1', pt;
    if (window.DOMPurify) DOMPurify.addHook('afterSanitizeAttributes', function (n) {
      if (n.tagName === 'A' && n.getAttribute('href')) { n.setAttribute('target', '_blank'); n.setAttribute('rel', 'noopener noreferrer'); }
    });
    function renderPrev() {
      var p = $('preview');
      p.hidden = !(prevOn && $('mode').value === 'markdown');
      if (p.hidden) return;
      if (window.marked && window.DOMPurify) p.innerHTML = DOMPurify.sanitize(marked.parse(editor.getValue()));
      else p.textContent = 'The preview needs internet access to load the Markdown library.';
    }
    function syncPrevUi() {
      var b = $('btn-prev');
      b.hidden = $('mode').value !== 'markdown';
      b.setAttribute('aria-pressed', prevOn); b.classList.toggle('on', prevOn);
      renderPrev();
    }
    $('btn-prev').onclick = function () { prevOn = !prevOn; save('prev', prevOn ? '1' : '0'); syncPrevUi(); };
    editor.onDidChangeModelContent(function () { clearTimeout(pt); pt = setTimeout(renderPrev, 150); });

    // Shell and Python files always start with a shebang (checked on download and when a file is opened).
    function ensureShebang() {
      var want = SHEBANG[$('mode').value], m = editor.getModel();
      if (want && !/^#!/.test(m.getLineContent(1))) editor.executeEdits('shebang', [{ range: new monaco.Range(1, 1, 1, 1), text: want + '\n' }]);
    }
    function setLang(v) {
      try { views[cur] = editor.saveViewState(); } catch (e) {}
      cur = v; $('mode').value = v; save('lang', v);
      editor.setModel(getModel(v));
      try { if (views[v]) editor.restoreViewState(views[v]); } catch (e) {}
      status(); syncPrevUi();
    }
    syncPrevUi();

    $('mode').onchange = function () { setLang(this.value); };
    $('theme').onchange = function () { applyTheme(this.value); save('theme', this.value); };
    $('fsize').onchange = function () { editor.updateOptions({ fontSize: +this.value || 14 }); save('fsize', this.value); };
    $('wrap').onchange = function () { editor.updateOptions({ wordWrap: this.checked ? 'on' : 'off' }); save('wrap', this.checked ? '1' : '0'); };
    $('mini').onchange = function () { editor.updateOptions({ minimap: { enabled: this.checked } }); save('mini', this.checked ? '1' : '0'); };
    $('bom').onchange = function () { save('bom', this.checked ? '1' : '0'); };
    $('eol').onchange = function () { var v = +this.value; Object.keys(models).forEach(function (l) { models[l].setEOL(v); }); save('eol', this.value); status(); };
    document.addEventListener('click', function (e) { if (!$('set').contains(e.target)) $('set').open = false; });

    $('btn-copy').onclick = function () {
      var btn = this, txt = editor.getValue();
      function done() { btn.textContent = 'Copied'; setTimeout(function () { btn.textContent = 'Copy'; }, 1200); }
      function fallback() { editor.focus(); editor.setSelection(editor.getModel().getFullModelRange()); document.execCommand('copy'); done(); }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, fallback); else fallback();
    };
    $('btn-paste').onclick = function () {
      if (!navigator.clipboard || !navigator.clipboard.readText) { alert('This browser blocks clipboard reading. Click in the editor and press Ctrl+V.'); return; }
      navigator.clipboard.readText().then(function (s) {
        editor.executeEdits('paste', [{ range: editor.getSelection(), text: s, forceMoveMarkers: true }]); editor.focus();
      }, function () { alert('Clipboard access was denied. Click in the editor and press Ctrl+V.'); });
    };
    $('btn-clear').onclick = function () { if (confirm('Clear the ' + $('mode').selectedOptions[0].textContent + ' text? Other languages are not affected.')) { editor.setValue(''); editor.focus(); } };

    function download() {
      ensureShebang();
      var unix = !!SHEBANG[$('mode').value], text = editor.getValue();
      if (unix) text = text.replace(/\r\n/g, '\n');   // CRLF or a BOM would break the shebang line
      var parts = $('bom').checked && !unix ? ['\uFEFF', text] : [text];
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob(parts, { type: 'text/plain;charset=utf-8' }));
      a.download = 'script' + ext();
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
      $('saved').textContent = 'Downloaded script' + ext() + '. Your text stays saved in this browser.';
    }
    $('btn-save').onclick = download;
    editor.addCommand(monaco.KeyMod.CtrlCmd | monaco.KeyCode.KeyS, function () {});

    function openFile(f) {
      if (!f) return;
      var r = new FileReader();
      r.onload = function () {
        var e = (f.name.match(/\.[^.]+$/) || [''])[0].toLowerCase();
        if (e === '.yaml') e = '.yml';
        LANGS.forEach(function (l) { if (l[2] === e) setLang(l[0]); });
        editor.setValue(String(r.result).replace(/^\uFEFF/, ''));
        editor.getModel().setEOL(+$('eol').value);
        ensureShebang();
      };
      r.readAsText(f);
    }
    $('btn-open').onclick = function () { $('file').click(); };
    $('file').onchange = function () { openFile(this.files[0]); this.value = ''; };
    ['dragenter', 'dragover'].forEach(function (n) { document.addEventListener(n, function (e) { e.preventDefault(); document.body.classList.add('drag'); }); });
    document.addEventListener('dragleave', function (e) { if (!e.relatedTarget) document.body.classList.remove('drag'); });
    document.addEventListener('drop', function (e) { e.preventDefault(); document.body.classList.remove('drag'); openFile(e.dataTransfer.files[0]); });
  });
})();
</script>
</body>
</html>
